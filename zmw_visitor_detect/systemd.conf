[Service]
# The GPU: video decoding (VA-API) and inference (OpenVINO) use its render node. Only DRM devices are allowed, on top
# of /dev/null and co (and the RTC, read only, from ProtectClock)
PrivateDevices=no
DevicePolicy=closed
DeviceAllow=char-drm rw
# Recordings: inject_clip plays clips from them, and faces are saved next to them
BindPaths=@CFG:allowed_paths@
# Notification images, for notifiers to read by path (usually in the shared scratch dir, which is already bound)
BindPaths=@CFG:notification_img_dir@
